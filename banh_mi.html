<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bánh Mì Sài Gòn - Khám Phá Parallax</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&family=Baloo+2:wght@600;700;800;900&family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="parallax-showcase.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--color-warm-bg, #F1DEBE);
    }
    .culinary-top-bar-minimal {
      position: absolute;
      top: 18px;
      left: 20px;
      z-index: 100;
      pointer-events: none;
    }
    .culinary-top-bar-minimal .btn-top-back {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 22px;
      border-radius: 999px;
      font-family: 'Baloo 2', 'Be Vietnam Pro', sans-serif;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, #A8201A 0%, #8D3B1B 100%);
      color: #FFFFFF;
      border: 1.5px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 4px 16px rgba(168, 32, 26, 0.4);
      transition: all 0.25s ease;
      text-decoration: none;
    }
    .culinary-top-bar-minimal .btn-top-back:hover {
      background: linear-gradient(135deg, #B91C1C 0%, #991B1B 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(168, 32, 26, 0.55);
    }
  </style>
</head>
<body>

  <div class="culinary-parallax-stage" id="foodDetailStage" data-active-dish="banh_mi">
    <header class="culinary-top-bar-minimal">
      <a href="index.html?skipIntro=true&fromTile=26" class="btn-top-back" id="btnBackToBoard" aria-label="Quay lại bàn cờ">
        <span class="btn-icon">◀</span>
        <span>Quay lại Bàn Cờ</span>
      </a>
    </header>

    <div class="culinary-parallax-background"></div>
    <div class="culinary-showcase-container"></div>
    <div class="detail-nav-dots"></div>
  </div>

  <script src="parallax-showcase.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const fromTile = urlParams.get('fromTile') || '26';
      const backBtn = document.getElementById('btnBackToBoard');
      if (backBtn) {
        backBtn.href = `index.html?skipIntro=true&fromTile=${fromTile}`;
      }
      CulinaryParallax.init('foodDetailStage');
    });
  </script>
</body>
</html>
